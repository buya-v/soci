name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/soci
            git pull origin main
            docker compose build
            docker compose up -d
            # Health check: verify the container is running and responsive
            sleep 5
            docker compose exec app node -e "console.log('healthy')" || echo "Warning: health check failed"
            echo "Deployment complete"
