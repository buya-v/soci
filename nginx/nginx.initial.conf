# HTTP-only config for initial Certbot certificate issuance
# Use this before SSL certificates exist
server {
    listen 80;
    server_name ${DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'Waiting for SSL certificate setup...';
        add_header Content-Type text/plain;
    }
}
